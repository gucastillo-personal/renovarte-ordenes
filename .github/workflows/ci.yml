# CI de solo lectura: corre `pnpm gate` (lint + typecheck + test +
# check:leak). Nunca despliega ni toca infraestructura real. El job de
# Terraform se agrega con la infra (plan.md ## Infra), no en B2.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate
